name: Wiki update (AI-drafted)
description: Describe what changed and drop in a few screenshots. The AI will write the wiki update.
title: "[Wiki] "
labels: ["wiki-update"]
body:
  - type: markdown
    attributes:
      value: |
        ### How this works

        1. In the box below, **paste or drag in screenshots** (GitHub uploads them automatically).
        2. Write a few sentences in plain English: what changed, where the user sees it.
        3. Pick which wiki area(s) the change affects.
        4. Submit. The AI will open a PR with the wiki edits within a couple of minutes and reply here with the link.

        > You don't need to know markdown or git. Screenshots plus a plain-English description are enough.

  - type: textarea
    id: description
    attributes:
      label: What's changing in this update?
      description: Paste or drag screenshots into this box, and describe in plain English what changed.
      placeholder: |
        Example:
        We added a "Generate AI Summary" button at the top of the Opportunity Tracker.
        Clicking it opens a panel on the right with the AI summary, key dates, and a
        clearance-match assessment for that opportunity.

        (Drop in 1–3 screenshots — e.g. before/after, or the new panel.)
    validations:
      required: true

  - type: dropdown
    id: areas
    attributes:
      label: Which wiki areas does this affect?
      description: Pick the wiki module(s) this change touches (multi-select). The AI will focus its edits on these pages.
      multiple: true
      options:
        - intro
        - opportunity-tracker
        - talent-wall
        - bid-builder
        - other
    validations:
      required: true

  # NOTE: dropdown options are static. If the wiki structure changes (new/removed
  # top-level docs), update this list. GitHub Issue Forms don't support dynamic
  # options, so this stays static + maintained by hand.
