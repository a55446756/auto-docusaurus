name: AI Wiki Update

on:
  issues:
    types: [labeled, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  update-wiki:
    if: contains(github.event.issue.labels.*.name, 'wiki-update')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "wiki-ai-bot"
          git config user.email "wiki-ai-bot@users.noreply.github.com"

      - name: Run wiki update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/wiki-update/index.mjs
